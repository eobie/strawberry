name: Build macOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to trigger builds manually from the GitHub UI

jobs:
  build:
    runs-on: macos-latest # Uses GitHub's cloud Mac runner

    steps:
      # 1. Download your repository code onto the Mac runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. (Optional) Select a specific Xcode version
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # 3. Compile the app (unsigned for testing/personal use)
      - name: Build App
        run: |
          xcodebuild -project Strawberry.xcodeproj \
            -scheme YourAppScheme \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      # 4. Zip the compiled .app bundle so you can download it
      - name: Package App
        run: |
          cd build/Build/Products/Release
          zip -r Strawberry-macOS.zip Strawberry.app

      # 5. Upload the zipped app to GitHub
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: build/Build/Products/Release/Strawberry-macOS.zip
