name: Build Strawberry macOS

on:
  push:
    branches: [ "main", "master" ] # Triggers on either branch name
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download and extract macOS dependencies
        run: |
          ARCH=$(uname -m)
          curl -f -O -L "https://github.com/strawberrymusicplayer/strawberry-macos-dependencies/releases/latest/download/strawberry-macos-${ARCH}-release.tar.xz"
          sudo tar -C / -xf "strawberry-macos-${ARCH}-release.tar.xz"
          rm "strawberry-macos-${ARCH}-release.tar.xz"

      - name: Configure with CMake
        run: |
          ARCH=$(uname -m)
          DEPS="/opt/strawberry_macos_${ARCH}_release"
          mkdir -p build
          PKG_CONFIG_PATH="${DEPS}/lib/pkgconfig" \
          LDFLAGS="-L${DEPS}/lib -Wl,-rpath,${DEPS}/lib" \
          "${DEPS}/bin/cmake" -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_BUNDLE=ON \
            -DCMAKE_PREFIX_PATH="${DEPS}/lib/cmake" \
            -DPKG_CONFIG_EXECUTABLE="${DEPS}/bin/pkg-config" \
            -DICU_ROOT="${DEPS}" \
            -DMACDEPLOYQT_EXECUTABLE="${DEPS}/bin/macdeployqt" \
            -DARCH="${ARCH}" \
            -DENABLE_SPARKLE=OFF \
            -DENABLE_QTSPARKLE=OFF

      - name: Build, Deploy, and Create DMG
        run: |
          ARCH=$(uname -m)
          DEPS="/opt/strawberry_macos_${ARCH}_release"
          export GIO_EXTRA_MODULES="${DEPS}/lib/gio/modules"
          export GST_PLUGIN_SCANNER="${DEPS}/libexec/gstreamer-1.0/gst-plugin-scanner"
          export GST_PLUGIN_PATH="${DEPS}/lib/gstreamer-1.0"
          export LIBSOUP_LIBRARY_PATH="${DEPS}/lib/libsoup-3.0.0.dylib"

          cd build
          make -j $(sysctl -n hw.ncpu)
          make install
          make deploy
          make dmg

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: strawberry-macos-dmg
          path: build/*.dmg
