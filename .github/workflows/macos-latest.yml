name: Build Strawberry macOS

on:
  push:
    branches: [ "master" ] # Note: Your fork uses 'master', not 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest # Runs on Apple Silicon (arm64)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: brew install cmake ninja pkg-config

      - name: Download pre-built macOS dependencies
        run: |
          sudo mkdir -p /opt
          # Fetches the latest arm64 release archive from strawberry-macos-dependencies
          DEP_URL=$(curl -s https://github.com | grep "browser_download_url.*arm64.*\.tar\." | cut -d '"' -f 4 | head -n 1)
          echo "Downloading $DEP_URL"
          curl -L "$DEP_URL" -o /tmp/deps.tar.xz
          sudo tar -xf /tmp/deps.tar.xz -C /opt

      - name: Configure with CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/opt/strawberry_macos_arm64_release \
            -DUSE_BUNDLE=ON \
            -DENABLE_SPARKLE=OFF

      - name: Build and Bundle App
        run: |
          cmake --build build --parallel $(sysctl -n hw.ncpu)
          cmake --install build --prefix build/install
          # Package dependencies into the .app bundle
          cd build && ninja deploy

      - name: Package .app as ZIP
        run: |
          cd build
          zip -r Strawberry-macOS-arm64.zip strawberry.app

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: strawberry-macos
          path: build/Strawberry-macOS-arm64.zip
